<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Diagrama de bloques - ALU3</title>
<style>
.box{fill:#f8fafc;stroke:#334155;stroke-width:1.5;}
.boxTeal{fill:#e6fffa;stroke:#0f766e;stroke-width:1.5;}
.boxAmber{fill:#fffbeb;stroke:#b45309;stroke-width:1.5;}
.boxPurple{fill:#f5f3ff;stroke:#6d28d9;stroke-width:1.5;}
.th{font:600 14px sans-serif;fill:#111827;}
.ts{font:12px sans-serif;fill:#374151;}
.arr{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#arrow);}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="ts" x="340" y="24" text-anchor="middle">x[16], y[16], z[16]</text>

<rect class="boxTeal" x="220" y="40" width="240" height="56" rx="8"/>
<text class="th" x="340" y="60" text-anchor="middle">Subexpresiones compartidas</text>
<text class="ts" x="340" y="80" text-anchor="middle">X AND Y · X OR Y · X + Y</text>

<line x1="340" y1="96" x2="340" y2="140" class="arr"/>

<rect class="boxAmber" x="90" y="140" width="500" height="220" rx="8"/>
<text class="th" x="340" y="162" text-anchor="middle">8 operaciones candidatas (en paralelo)</text>
<text class="ts" x="180" y="188" text-anchor="middle">000  X+Y+Z</text>
<text class="ts" x="500" y="188" text-anchor="middle">001  (X AND Y) OR Z</text>
<text class="ts" x="180" y="216" text-anchor="middle">010  (X OR Y) AND Z</text>
<text class="ts" x="500" y="216" text-anchor="middle">011  X AND Y AND Z</text>
<text class="ts" x="180" y="244" text-anchor="middle">100  X OR Y OR Z</text>
<text class="ts" x="500" y="244" text-anchor="middle">101  X+Y-Z</text>
<text class="ts" x="180" y="272" text-anchor="middle">110  (NOT X) AND Y AND Z</text>
<text class="ts" x="500" y="272" text-anchor="middle">111  -(X+Y+Z)</text>
<text class="ts" x="340" y="332" text-anchor="middle">op5 y op7 reusan X+Y via Inc16/Not16</text>

<line x1="340" y1="360" x2="340" y2="400" class="arr"/>
<text class="ts" x="480" y="395" text-anchor="middle">opcode[3]</text>
<line x1="480" y1="20" x2="480" y2="400" class="arr" stroke-dasharray="4 3"/>

<rect class="boxPurple" x="220" y="400" width="240" height="56" rx="8"/>
<text class="th" x="340" y="420" text-anchor="middle">Mux8Way16</text>
<text class="ts" x="340" y="440" text-anchor="middle">sel = opcode</text>

<line x1="340" y1="456" x2="340" y2="496" class="arr"/>

<rect class="box" x="220" y="496" width="240" height="56" rx="8"/>
<text class="th" x="340" y="524" text-anchor="middle">out[16]</text>

<line x1="340" y1="552" x2="340" y2="560" class="arr"/>

<rect class="box" x="220" y="560" width="240" height="50" rx="8"/>
<text class="th" x="340" y="580" text-anchor="middle">Flags: zr, ng</text>
<text class="ts" x="340" y="598" text-anchor="middle">ng = out[15]</text>
</svg>
